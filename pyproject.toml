[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cua-lark"
version = "1.0.0"
description = "Screenshot-first multimodal Computer-Use Agent framework for Feishu/Lark on macOS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "闫家硕"}]
keywords = ["computer-use-agent", "gui-agent", "vlm", "feishu", "lark", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "openai>=1.30,<3",
  "Pillow>=10,<13",
  "PyAutoGUI>=0.9.54,<1",
  "PyYAML>=6,<7",
  "pyobjc-framework-Cocoa>=10,<13; platform_system == 'Darwin'",
  "pyobjc-framework-Quartz>=10,<13; platform_system == 'Darwin'",
]

[project.optional-dependencies]
web = ["gradio>=5,<7"]
dev = ["pytest>=8,<10"]

[project.scripts]
cua-lark = "cua_lark.cli:main"
cua-lark-web = "cua_lark.web.app:main"

[project.urls]
Documentation = "https://github.com/yanjiashuo/CUA-Lark#readme"
Issues = "https://github.com/yanjiashuo/CUA-Lark/issues"
Source = "https://github.com/yanjiashuo/CUA-Lark"

[tool.setuptools.packages.find]
include = ["cua_lark*"]

[tool.setuptools.package-data]
cua_lark = ["rules/*.md", "scenarios/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
